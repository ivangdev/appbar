name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint, tipos, migraciones y tests contra PostgreSQL real.
  # ---------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pos_bar
          POSTGRES_USER: pos_user
          POSTGRES_PASSWORD: pos_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos_user -d pos_bar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: pos_bar
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_pass
      JWT_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      COOKIE_SECURE: "False"
      SEED_DEMO_USERS: "False"
      INITIAL_ADMIN_PASSWORD: ci-admin-password-123
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tipos (mypy --strict)
        run: mypy app --strict

      - name: Migraciones desde cero
        run: alembic upgrade head

      - name: Tests
        run: pytest tests/ -q

  # ---------------------------------------------------------------------------
  # Frontend: lint, tests unitarios, build de produccion y contrato OpenAPI.
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Contrato OpenAPI (tipos generados sin diff)
        run: |
          npm run gen:types
          git diff --exit-code -- lib/api-types.ts

  # ---------------------------------------------------------------------------
  # E2E: stack completo con Docker Compose + Playwright (incluye WebSocket).
  # ---------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Preparar .env del stack
        working-directory: infra
        run: |
          cp .env.example .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-secret-0123456789abcdef0123456789abcdef/' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-pos-pass/' .env
          sed -i 's/^INITIAL_ADMIN_PASSWORD=.*/INITIAL_ADMIN_PASSWORD=admin12345/' .env
          sed -i 's/^COOKIE_SECURE=.*/COOKIE_SECURE=False/' .env
          docker compose up -d --build

      - name: Esperar healthchecks
        working-directory: infra
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health/ready \
              && curl -fsS http://localhost:3000/login > /dev/null; then
              echo "stack listo"
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias y navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npm run e2e

      - name: Logs del stack (si falla)
        if: failure()
        working-directory: infra
        run: docker compose logs --tail=300

      - name: Bajar el stack
        if: always()
        working-directory: infra
        run: docker compose down -v
