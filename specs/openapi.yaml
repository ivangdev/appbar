# =============================================================================
# openapi.yaml — POS Bar API v1 (OpenAPI 3.1)
# Fuente de verdad para el contrato REST. Generado desde specs/PDR.yaml.
# Valido con Swagger Editor / `fastapi[standard]`.
# =============================================================================
openapi: 3.1.0

info:
  title: POS Bar API
  description: |
    API REST para punto de venta de bar.
    - Login obligatorio (admin / waiter).
    - Gestion de mesas, ordenes, items, pagos parciales por item (pokers) y pago total.
    - Reportes de cierre de dia.
    - WebSocket en /ws/tables (eventos de mesas en vivo).
    Dinero: pesos colombianos (COP) como ENTEROS, sin centavos (se redondea ROUND_HALF_UP).
    cost de productos: visible SOLO para admin; el mesero solo ve price.
    WebSocket: autenticado por cookie HttpOnly access_token (jamas token en la URL).
  version: "1.3.0"

servers:
  - url: https://bar.local/v1    # cambia por tu dominio DuckDNS / real
    description: Produccion
  - url: http://localhost:8000/v1
    description: Local (dev)

# WebSocket (no descrito por el estandar OpenAPI, documentado aqui).
x-websocket:
  path: /ws/tables
  auth: "Cookie HttpOnly 'access_token' (JWT) enviada en el handshake. Sin token en la URL. WSS en produccion."
  events: [table_status_update, new_order, order_updated, order_closed, order_cancelled, payment_made, payment_cancelled, order_paid]
  event_payload:
    order_events: "{order_id, table_id, table_number, status, table_status, total_amount, amount_paid, remaining}"
    table_status_update: "{table_id, table_number, status}"

# JWT vive en HttpOnly cookie "access_token"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT Bearer en cookie HttpOnly

  schemas:
    # ---- Auth ----
    Token:
      type: object
      required: [access_token]
      properties:
        access_token: { type: string }
        token_type: { type: string, default: bearer }

    UserLogin:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: mesero@posbar.com }
        password: { type: string, format: password, minLength: 8 }

    UserRead:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, waiter] }
        is_active: { type: boolean, default: true }

    UserCreate:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        role: { type: string, enum: [admin, waiter] }

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, waiter] }
        is_active: { type: boolean }

    # ---- Catalogo ----
    CategoryRead:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        is_active: { type: boolean }
        sort_order: { type: integer }

    CategoryCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        sort_order: { type: integer, default: 0 }

    ProductRead:
      type: object
      required: [id, name, price]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category_id: { type: string, format: uuid }
        price: { type: integer, format: int64, description: "pesos COP (entero)" }
        cost: { type: integer, format: int64, description: "pesos COP; OMITIDO en respuestas para rol waiter (solo admin)" }
        sku: { type: string, nullable: true }
        is_active: { type: boolean }

    ProductCreate:
      type: object
      required: [name, category_id, price]
      properties:
        name: { type: string }
        category_id: { type: string, format: uuid }
        price: { type: integer, format: int64, minimum: 0, description: "pesos COP" }
        cost: { type: integer, format: int64, minimum: 0, default: 0, description: "pesos COP (solo admin)" }
        sku: { type: string, nullable: true }

    # ---- Mesas ----
    TableRead:
      type: object
      required: [id, table_number, status]
      properties:
        id: { type: string, format: uuid }
        table_number: { type: integer }
        label: { type: string, nullable: true }
        status: { type: string, enum: [free, occupied] }

    TableCreate:
      type: object
      required: [table_number]
      properties:
        table_number: { type: integer }
        label: { type: string, nullable: true }

    TableUpdate:
      type: object
      properties:
        label: { type: string, nullable: true }

    # ---- Ordenes / Items / Pagos ----
    OrderStatus:
      type: string
      enum: [open, closed, partially_paid, paid, cancelled]

    OrderCreate:
      type: object
      required: [table_id]
      properties:
        table_id: { type: string, format: uuid }

    OrderItemRead:
      type: object
      required: [id, order_id, product_id, quantity, paid_quantity, unit_price, total_price]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, description: "unidades enteras" }
        paid_quantity: { type: integer, minimum: 0, default: 0, description: "0 <= paid_quantity <= quantity" }
        unit_price: { type: integer, format: int64, description: "pesos COP" }
        total_price: { type: integer, format: int64, description: "pesos COP" }
        notes: { type: string, nullable: true }

    OrderItemCreate:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, default: 1 }
        notes: { type: string, nullable: true }

    OrderItemUpdate:
      type: object
      properties:
        quantity: { type: integer, minimum: 1, description: "no puede ser menor que paid_quantity (si no -> 409)" }
        notes: { type: string, nullable: true }

    PaymentAllocation:
      type: object
      required: [item_id, quantity]
      properties:
        item_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, example: 3, description: "unidades del item cubiertas por este pago" }

    OrderPayment:
      type: object
      required: [amount, method]
      properties:
        amount: { type: integer, format: int64, minimum: 1, example: 5000, description: "pesos COP; <= remaining" }
        method: { type: string, enum: [cash, nequi, transfer] }
        reference: { type: string, nullable: true }
        allocations:
          type: array
          description: "Pago parcial por item (pokers). Omitido o vacio = pago total del remaining (auto-asigna items pendientes)."
          items: { $ref: "#/components/schemas/PaymentAllocation" }

    OrderRead:
      type: object
      required: [id, table_id, user_id, status, subtotal, total_amount, amount_paid, remaining, items, payments]
      properties:
        id: { type: string, format: uuid }
        table_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/OrderStatus" }
        subtotal: { type: integer, format: int64, description: "pesos COP" }
        total_amount: { type: integer, format: int64, description: "pesos COP" }
        amount_paid: { type: integer, format: int64, description: "pesos COP" }
        remaining: { type: integer, format: int64, description: "pesos COP = total_amount - amount_paid" }
        closed_at: { type: string, format: date-time, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItemRead" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/PaymentRead" }

    PaymentRead:
      type: object
      required: [id, order_id, amount, method, payment_date]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        amount: { type: integer, format: int64, description: "pesos COP" }
        method: { type: string, enum: [cash, nequi, transfer] }
        reference: { type: string, nullable: true }
        payment_date: { type: string, format: date-time }
        user_id: { type: string, format: uuid }
        allocations:
          type: array
          items: { $ref: "#/components/schemas/PaymentAllocation" }

    PaymentCancelResponse:
      type: object
      properties:
        cancelled: { type: boolean }
        amount: { type: integer, format: int64, description: "pesos COP" }
        order: { $ref: "#/components/schemas/OrderRead" }
        remaining: { type: integer, format: int64, description: "pesos COP" }

    # ---- Reportes ----
    ReportByTable:
      type: object
      required: [table_number, total]
      properties:
        table_number: { type: integer }
        total: { type: integer, format: int64, description: "pesos COP" }

    ReportByProduct:
      type: object
      required: [name, qty, revenue]
      properties:
        name: { type: string }
        qty: { type: integer, description: "unidades" }
        revenue: { type: integer, format: int64, description: "pesos COP" }

    DailyReport:
      type: object
      required: [date, total, by_table, by_product]
      properties:
        date: { type: string, format: date }
        total: { type: integer, format: int64, description: "pesos COP" }
        by_table:
          type: array
          items: { $ref: "#/components/schemas/ReportByTable" }
        by_product:
          type: array
          items: { $ref: "#/components/schemas/ReportByProduct" }

    # ---- Reutilizables ----
    ErrorResponse:
      type: object
      properties:
        detail: { type: string }

  responses:
    Unauthorized:
      description: No autorizado (login requerido)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Forbidden:
      description: Prohibido (rol insuficiente)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: "Conflicto de estado (ej: orden ya pagada, mesa ocupada)"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    TooManyRequests:
      description: "Demasiadas solicitudes (rate limit por IP excedido, slowapi)"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

paths:
  # ----------------------------------------------------------------- Auth
  /auth/token:
    post:
      summary: Login (setea cookie JWT)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLogin"
      responses:
        "200":
          description: Token + cookie HttpOnly
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "access_token=...; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=86400"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      summary: Logout (borra cookie)
      tags: [auth]
      security: []
      responses:
        "204": { description: "Cookie borrada" }

  /auth/me:
    get:
      summary: Usuario autenticado
      tags: [auth]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Usuario
          content: { application/json: { schema: { $ref: "#/components/schemas/UserRead" } } }

  # ----------------------------------------------------------------- Categorias
  /categories:
    get:
      summary: Lista categorias
      tags: [categories]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CategoryRead" } } } }
    post:
      summary: Crear categoria (admin)
      tags: [categories]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CategoryCreate" } } }
      responses:
        "201": { description: creada }
        "403": { $ref: "#/components/responses/Forbidden" }

  /categories/{id}:
    put:
      summary: Actualizar categoria (admin)
      tags: [categories]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CategoryCreate" } } }
      responses: { "200": { description: actualizado } }
    delete:
      summary: Soft-delete categoria (admin)
      tags: [categories]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: eliminada } }

  # ----------------------------------------------------------------- Productos
  /products:
    get:
      summary: Lista productos (+ ?category_id)
      tags: [products]
      security: [{ cookieAuth: [] }]
      parameters:
        [{ name: category_id, in: query, schema: { type: string, format: uuid } }]
      responses:
        "200":
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProductRead" } } } }
    post:
      summary: Crear producto (admin)
      tags: [products]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProductCreate" } } }
      responses: { "201": { description: creado }, "403": { $ref: "#/components/responses/Forbidden" } }

  /products/{id}:
    put:
      summary: Actualizar producto (admin)
      tags: [products]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProductCreate" } } }
      responses: { "200": { description: actualizado } }
    delete:
      summary: Soft-delete producto (admin)
      tags: [products]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: eliminado } }

  # ----------------------------------------------------------------- Mesas
  /tables:
    get:
      summary: Lista mesas + estado
      tags: [tables]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TableRead" } } } }
    post:
      summary: Crear mesa (admin)
      tags: [tables]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TableCreate" } } }
      responses: { "201": { description: creada } }

  /tables/{id}:
    patch:
      summary: Actualizar mesa (admin)
      tags: [tables]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TableUpdate" } } }
      responses: { "200": { description: actualizada } }
    delete:
      summary: Eliminar mesa (admin)
      tags: [tables]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: eliminada } }

  # ----------------------------------------------------------------- Ordenes
  /orders:
    get:
      summary: Orden activa de una mesa (+ ?table_id)
      tags: [orders]
      security: [{ cookieAuth: [] }]
      parameters:
        [{ name: table_id, in: query, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          content: { application/json: { schema: { $ref: "#/components/schemas/OrderRead" } } }
        "404": { $ref: "#/components/responses/Conflict" }
    post:
      summary: Abrir orden en mesa -> status open, mesa occupied
      tags: [orders]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrderCreate" } } }
      responses:
        "201": { description: orden abierta, content: { application/json: { schema: { $ref: "#/components/schemas/OrderRead" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /orders/{id}/close:
    post:
      summary: Cerrar orden -> status closed, mesa sigue occupied
      tags: [orders]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: cerrada, content: { application/json: { schema: { $ref: "#/components/schemas/OrderRead" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /orders/{id}/pay:
    post:
      summary: "Registrar pago: parcial por items (allocations) o total (sin allocations). Al remaining==0 -> paid y mesa free."
      tags: [orders]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrderPayment" } } }
      responses:
        "200":
          description: pago registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: "#/components/schemas/PaymentRead" }
                  order: { $ref: "#/components/schemas/OrderRead" }
                  remaining: { type: integer, format: int64, description: "pesos COP" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /orders/{id}/items:
    post:
      summary: Agregar item a orden
      tags: [orders]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrderItemCreate" } } }
      responses: { "201": { description: item agregado, content: { application/json: { schema: { $ref: "#/components/schemas/OrderItemRead" } } } } }

  /orders/items/{item_id}:
    patch:
      summary: "Editar item (qty/notes). quantity no puede ser < paid_quantity -> 409."
      tags: [orders]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: item_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrderItemUpdate" } } }
      responses:
        "200": { description: actualizado, content: { application/json: { schema: { $ref: "#/components/schemas/OrderItemRead" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: Quitar item (solo si la orden no esta 100% pagada)
      tags: [orders]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: item_id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: borrado } }

  /orders/{id}/cancel:
    post:
      summary: Cancelar orden (solo si open) -> status cancelled, mesa free
      tags: [orders]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: cancelada, content: { application/json: { schema: { $ref: "#/components/schemas/OrderRead" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /payments/{id}/cancel:
    post:
      summary: "Cancelar pago. Revierte allocations. Recalcula estado: amount_paid==0 -> closed; >0 -> partially_paid. Si la orden estaba paid -> paid_at=null. Mesa occupied salvo remaining==0."
      tags: [payments]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: pago cancelado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentCancelResponse" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orders/history:
    get:
      summary: Historico de ordenes del dia
      tags: [orders]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: date, in: query, schema: { type: string, format: date }, required: false }]
      responses:
        "200":
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OrderRead" } } } }

  # ----------------------------------------------------------------- Reportes
  /reports/daily:
    get:
      summary: Corte de dia (admin + mesero, TZ America/Bogota). Solo ordenes paid.
      tags: [reports]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: date, in: query, schema: { type: string, format: date }, required: false }]
      responses:
        "200":
          content: { application/json: { schema: { $ref: "#/components/schemas/DailyReport" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ----------------------------------------------------------------- Usuarios
  /users:
    get:
      summary: Lista usuarios (admin)
      tags: [users]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/UserRead" } } } }
    post:
      summary: Crear mesero (admin)
      tags: [users]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UserCreate" } } }
      responses: { "201": { description: creado } }

  /users/{id}:
    patch:
      summary: Editar usuario (admin)
      tags: [users]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UserUpdate" } } }
      responses: { "200": { description: actualizado } }
    delete:
      summary: Desactivar usuario (admin)
      tags: [users]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: desactivado } }
