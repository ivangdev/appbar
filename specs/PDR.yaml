# =============================================================================
# PDR — Product Development Roadmap
# POS (Point of Sale) para bar
# Spec-Driven Development. Machine-readable + human-friendly YAML.
# =============================================================================

meta:
  name: "POS Bar System"
  version: "1.3"
  stack:
    frontend: "Next.js 16.4 (App Router, Turbopack, React 19.3)"
    backend: "FastAPI 0.115+ (Python 3.12, Pydantic v2)"
    database: "PostgreSQL 16"
    auth: "JWT HS256 -> HttpOnly Cookie (SameSite=Lax, Secure)"
    state: "TanStack Query v5 + Zustand"
    websocket: "FastAPI WebSocket (/ws/tables)"
    http: "Axios + interceptor JWT"
    styles: "Tailwind CSS + shadcn/ui"
    proxy: "Caddy 2 + Let's Encrypt (auto)"
    deploy: "Docker en VPS Debian (Dokploy)"
    testing: "Vitest / Pytest / Playwright / Pact / OWASP ZAP"

vision: >
  Aplicacion web POS para bar. El mesero abre mesas, agrega productos,
  ve subtotal en vivo, cierra la orden y cobra de dos formas: pago parcial
  por items/cantidad (por ejemplo "3 pokers") o pago total del saldo sin
  seleccionar items. Metodos: efectivo / Nequi / transferencia. La mesa
  sigue occupied mientras el saldo pendiente sea mayor a 0; se libera
  (free) solo cuando el saldo llega a 0. El admin gestiona usuarios,
  categorias, productos y mesas. El mesero tambien ve el corte del dia.
  Todo se registra en la app (sin recibo fisico, sin IVA, sin descuentos).
  Preparado para futuro control de stock (evento OrderPaid).

# -----------------------------------------------------------------------------
# Nota arquitectonica: arquitectura MODULAR SIMPLE y clara. No es DDD pesado
# (sin Entities/VO/Repositories/ID injection). Bounded Contexts son limites
# logicos de responsabilidad, escalables a microservicios futuros.
# -----------------------------------------------------------------------------
bounded_contexts:
  - name: auth
    ownership: "login, usuarios, JWT"
  - name: pos
    ownership: "mesas, ordenes, items, pagos, pagos parciales por item (pokers)"
  - name: catalog
    ownership: "categorias, productos"
  - name: reporting
    ownership: "cierre de dia, estadisticas"
  - name: inventory
    ownership: "(futuro) stock, recetas — escucha evento OrderPaid"

# -----------------------------------------------------------------------------
# Roles y permisos. Scopes simplificados (no OAuth2 complejo).
# -----------------------------------------------------------------------------
roles:
  admin:
    login_required: true
    pos_access: read_write
    crud: full
    reports: full          # ver + exportar reportes
  waiter:
    login_required: true
    pos_access: read_write # operar mesas/ordenes/pagos/abonos
    crud: read_only        # solo lectura de productos/categorias/mesas
    reports: read          # ve corte del dia (solo lectura)

# -----------------------------------------------------------------------------
# Historias de Usuario
# -----------------------------------------------------------------------------
user_stories:
  mesero:
    - id: HM-01
      story: "Ver estado de mesas en tiempo real"
      rule: "WebSocket. Estados mesa: free, occupied"
    - id: HM-02
      story: "Abrir orden en mesa Libre"
      rule: "Mesa -> occupied. Crea orden open"
    - id: HM-03
      story: "Agregar productos por categoria"
      rule: "Subtotal recalcula en vivo"
    - id: HM-04
      story: "Cerrar orden"
      rule: "Estado -> closed, mesa sigue occupied, muestra total a pagar"
    - id: HM-05
      story: "Registrar pago parcial por items/pokers"
      rule: "Selecciona item + cantidad (1, 2, 3...). Metodos: cash, nequi, transfer. Descuenta esos items del pendiente. Si remaining > 0 -> estado partially_paid, mesa sigue occupied."
    - id: HM-05b
      story: "Pagar saldo restante (pago total)"
      rule: "Pago total SIN seleccionar items: cubre todo el remaining y auto-asigna items pendientes. Al llegar remaining == 0 -> estado paid, mesa -> free, paid_at = now()."
    - id: HM-05c
      story: "Pago parcial que cubre el saldo"
      rule: "Si la suma pagada llega a == total -> estado paid, mesa -> free, paid_at = now()."
    - id: HM-06
      story: "Cancelar un pago (abono)"
      rule: "Revierte el pago y sus asignaciones; los items vuelven a pendiente. Si amount_paid queda 0 -> orden vuelve a closed, mesa -> occupied. Si amount_paid > 0 -> partially_paid, mesa occupied."
    - id: HM-07
      story: "Cancelar orden abierta"
      rule: "Solo si status = open -> status cancelled, mesa -> free."
    - id: HM-08
      story: "Ver corte del dia"
      rule: "waiter scope read. GET /reports/daily. Solo ordenes paid del dia (TZ America/Bogota)."

  admin:
    - id: HA-01
      story: "Iniciar sesion"
      rule: "Login con email + password"
    - id: HA-02
      story: "Gestionar meseros"
      rule: "CRUD usuarios (rol waiter)"
    - id: HA-03
      story: "Gestionar categorias y productos"
      rule: "CRUD"
    - id: HA-04
      story: "Gestionar mesas"
      rule: "CRUD"
    - id: HA-05
      story: "Consultar reporte de dia"
      rule: "Total, por mesa, por producto (solo paid)"

# -----------------------------------------------------------------------------
# Seguridad — OWASP API Top 10 2023
# -----------------------------------------------------------------------------
security:
  owasp_mitigations:
    - risk: "API1 Broken Object Level Authorization"
      mitigation: "Queries filtradas por user_id / rol"
    - risk: "API2 Broken Authentication"
      mitigation: "JWT con exp 24h; password con Argon2id (pwdlib)"
    - risk: "API3 Broken Object Property Authorization"
      mitigation: "Pydantic response_model define campos devueltos"
    - risk: "API4 Unrestricted Resource Consumption"
      mitigation: "slowapi rate limit por IP (login 20/min, pagos 60/min, reportes 120/min; 429) + limite de qty"
    - risk: "API5 Broken Function Level Authorization"
      mitigation: "Decorador @require_role('admin')"
    - risk: "API8 Security Misconfiguration"
      mitigation: "Headers HSTS/X-Content-Type, CORS, .env fuera de repo"
    - risk: "API9 Improper Inventory Management"
      mitigation: "OpenAPI versionado /v1/ + Swagger UI"
  auth_details:
    token:
      algorithm: "HS256"
      access_exp: "24h"
    cookie:
      http_only: true
      secure: true
      same_site: "Lax"
      path: "/"
      dev_note: "En local (http://localhost) Secure debe ser false o usar HTTPS; si no, el navegador no guarda la cookie."
    password: "Argon2id (pwdlib)"

# -----------------------------------------------------------------------------
# Base de Datos
# -----------------------------------------------------------------------------
database:
  tables:
    users:
      description: "Usuarios (admin + meseros)"
      columns:
        id: "UUID PK"
        name: "text"
        email: "text UNIQUE (case-insensitive: indice lower(email))"
        password_hash: "text (Argon2id)"
        role: "enum(admin / waiter)"
        is_active: "boolean default true"
        created_at: "timestamptz"
        updated_at: "timestamptz"
    tables:
      description: "Mesas del bar"
      columns:
        id: "UUID PK"
        table_number: "integer UNIQUE"
        label: "text nullable"
        status: "enum(free / occupied)"
        created_at: "timestamptz"
        updated_at: "timestamptz"
    categories:
      columns:
        id: "UUID PK"
        name: "text UNIQUE"
        is_active: "boolean default true"
        sort_order: "integer default 0"
        created_at: "timestamptz"
        updated_at: "timestamptz"
    products:
      columns:
        id: "UUID PK"
        name: "text"
        category_id: "UUID FK -> categories.id"
        price: "integer (pesos COP)"
        cost: "integer (pesos COP)  # visible solo admin; el mesero NUNCA lo ve"
        sku: "text UNIQUE nullable"
        is_active: "boolean default true"
        created_at: "timestamptz"
        updated_at: "timestamptz"
    orders:
      columns:
        id: "UUID PK"
        table_id: "UUID FK -> tables.id"
        user_id: "UUID FK -> users.id  # mesero que abrio"
        status: "enum(open / closed / partially_paid / paid / cancelled)"
        subtotal: "integer (pesos COP) snapshot"
        total_amount: "integer (pesos COP) = subtotal"
        amount_paid: "integer (pesos COP) -> suma(payments)  # calculado"
        closed_at: "timestamptz nullable"
        paid_at: "timestamptz nullable  # SOLO cuando status = paid"
        created_at: "timestamptz"
        updated_at: "timestamptz"
    order_items:
      columns:
        id: "UUID PK"
        order_id: "UUID FK -> orders.id"
        product_id: "UUID FK -> products.id"
        quantity: "integer default 1  # unidades enteras"
        paid_quantity: "integer default 0  # sumado por payment_allocations; CHECK 0 <= paid_quantity <= quantity"
        unit_price: "integer (pesos COP) snapshot"
        total_price: "integer (pesos COP) = unit_price * quantity"
        notes: "text nullable"
        created_at: "timestamptz"
    payments:
      columns:
        id: "UUID PK"
        order_id: "UUID FK -> orders.id"
        amount: "integer (pesos COP)  # pago parcial o total"
        method: "enum(cash / nequi / transfer)"
        reference: "text nullable"
        payment_date: "timestamptz default now()"
        user_id: "UUID FK -> users.id  # quien registro"
        created_at: "timestamptz"
    payment_allocations:
      description: "Asigna un pago a items/cantidades concretas (pokers). Efimero por orden."
      columns:
        id: "UUID PK"
        payment_id: "UUID FK -> payments.id ON DELETE CASCADE"
        order_item_id: "UUID FK -> order_items.id"
        quantity: "integer  # cantidad asignada del item (unidades)"
        amount: "integer (pesos COP) = quantity * unit_price"
        created_at: "timestamptz"

  indexes:
    - orders_status: "orders(status, table_id)"
    - orders_paid: "orders(paid_at)"
    - order_items: "order_items(order_id)"
    - products_cat: "products(category_id)"
    - payment_allocations: "payment_allocations(payment_id), payment_allocations(order_item_id)"

  constraints:
    - one_active_order_per_table: "UNIQUE (table_id) WHERE status IN ('open','closed','partially_paid')"
    - user_email_ci: "UNIQUE (lower(email))"
    - item_not_overpaid: "sum(payment_allocations.quantity) <= order_items.quantity"

# -----------------------------------------------------------------------------
# API REST — FastAPI
# -----------------------------------------------------------------------------
api_rest:
  base: "/v1"
  security_scheme: "Cookie: access_token (JWT bearer)"
  auth:
    - method: POST
      path: /auth/token
      scope: public
      body: "{email, password}"
      response: "{access_token, token_type: bearer}"
      side_effect: "setea HttpOnly cookie JWT (24h)"
    - method: POST
      path: /auth/logout
      scope: auth
      response: 204
    - method: GET
      path: /auth/me
      scope: auth
      response: "{id, name, email, role}"

  categories:
    - method: GET
      path: /categories
      scope: "waiter/admin"
      response: "[{id, name, sort_order}]"
    - method: POST
      path: /categories
      scope: admin
      body: "{name, sort_order?}"
      response: 201
    - method: PUT
      path: /categories/{id}
      scope: admin
      body: "{name, sort_order?}"
      response: 200
    - method: DELETE
      path: /categories/{id}
      scope: admin
      response: 204 (soft)

  products:
    - method: GET
      path: /products?category_id=
      scope: "waiter/admin"
      response: "[{id, name, price, sku?}]  # cost solo admin"
    - method: POST
      path: /products
      scope: admin
      body: "{name, category_id, price, cost?, sku?}"
      response: 201
    - method: PUT
      path: /products/{id}
      scope: admin
      body: "{name, category_id, price, cost?, sku?}"
      response: 200
    - method: DELETE
      path: /products/{id}
      scope: admin
      response: 204 (soft)

  tables:
    - method: GET
      path: /tables
      scope: "waiter/admin"
      response: "[{id, table_number, label?, status}]"
    - method: POST
      path: /tables
      scope: admin
      body: "{table_number, label?}"
      response: 201
    - method: PATCH
      path: /tables/{id}
      scope: admin
      body: "{label?}"
      response: 200
    - method: DELETE
      path: /tables/{id}
      scope: admin
      response: 204

  orders:
    - method: POST
      path: /orders
      scope: "waiter/admin"
      body: "{table_id}"
      rule: "-> status open, mesa -> occupied. Error 409 si la mesa ya tiene orden activa."
      response: 201
    - method: GET
      path: /orders?table_id=
      scope: "waiter/admin"
      response: "{order, items[], payments[]}  # orden activa de la mesa"
    - method: POST
      path: /orders/{id}/items
      scope: "waiter/admin"
      body: "{product_id, quantity, notes?}"
      rule: "recalcula subtotal orden (solo si status = open/closed/partially_paid)"
      response: 201
    - method: PATCH
      path: /orders/items/{item_id}
      scope: "waiter/admin"
      body: "{quantity?, notes?}"
      response: 200
    - method: DELETE
      path: /orders/items/{item_id}
      scope: "waiter/admin"
      response: 204
    - method: POST
      path: /orders/{id}/close
      scope: "waiter/admin"
      rule: "order open -> closed, mesa sigue occupied. Si status != open -> 409."
      response: 200
    - method: POST
      path: /orders/{id}/pay
      scope: "waiter/admin"
      body: "{amount, method, reference?, allocations?: [{item_id, quantity}]}"
      rule: "Dos modos: (a) parcial con allocations -> descuenta items/cantidades puntuales; (b) total sin allocations -> cubre todo el remaining y auto-asigna items pendientes. amount <= remaining. Si remaining == 0 -> paid, mesa free, paid_at=now(). Si >0 -> partially_paid, mesa occupied."
      response: "{payment, order, remaining}"
    - method: POST
      path: /payments/{id}/cancel
      scope: "waiter/admin"
      rule: "Revierte el pago y sus allocations (items vuelven a pendiente). Si amount_paid queda 0 -> orden vuelve a closed, mesa -> occupied. Si >0 -> partially_paid, mesa occupied."
      response: "{cancelled, order, remaining}"
    - method: POST
      path: /orders/{id}/cancel
      scope: "waiter/admin"
      rule: "Solo si status = open -> status cancelled, mesa -> free."
      response: 200
    - method: GET
      path: /orders/history?date=
      scope: "waiter/admin"
      response: "[{order, items[], payments[]}]"

  reports:
    - method: GET
      path: /reports/daily?date=
      scope: "waiter/admin"
      rule: "solo ordenes status=paid, paid_at del dia (TZ America/Bogota)"
      response: "{date, total, by_table: [{table_number, total}], by_product: [{name, qty, revenue}]}"

  users:
    - method: GET
      path: /users
      scope: admin
      response: "[{id, name, email, role, is_active}]"
    - method: POST
      path: /users
      scope: admin
      body: "{name, email, password, role: waiter}"
      response: 201
    - method: PATCH
      path: /users/{id}
      scope: admin
      body: "{name?, email?, role?, is_active?}"
      response: 200
    - method: DELETE
      path: /users/{id}
      scope: admin
      response: 204 (desactiva)

# -----------------------------------------------------------------------------
# WebSocket — contrato de eventos para mesas
# -----------------------------------------------------------------------------
websocket:
  channel: "/ws/tables"
  auth: "Cookie HttpOnly access_token (JWT) enviada automaticamente en el handshake. El token NUNCA va en la URL ni es visible en logs. Requiere HTTPS (WSS) en produccion."
  events:
    - name: table_status_update
      payload: "{table_id, table_number, status}"
      trigger: "cambio estado mesa (free / occupied)"
    - name: new_order
      payload: &order_payload "{order_id, table_id, table_number, status, table_status, total_amount, amount_paid, remaining}"
      trigger: "orden creada"
    - name: order_updated
      payload: *order_payload
      trigger: "item agregado, editado o eliminado; estado/montos recalculados"
    - name: order_closed
      payload: *order_payload
      trigger: "orden cerrada"
    - name: order_cancelled
      payload: *order_payload
      trigger: "orden cancelada (mesa liberada)"
    - name: payment_made
      payload: *order_payload
      trigger: "pago parcial o total registrado"
    - name: payment_cancelled
      payload: *order_payload
      trigger: "pago cancelado (revierte allocations)"
    - name: order_paid
      payload: *order_payload
      trigger: "orden pagada al 100% (remaining == 0)"
  client_behavior:
    connect_on: "dashboard de mesas"
    action: "actualiza cache de mesas reactivamente (TanStack Query)"

# -----------------------------------------------------------------------------
# Eventos internos (para futuro Stock)
# -----------------------------------------------------------------------------
internal_events:
  - name: OrderPaid
    emitter: "POST /orders/{id}/pay -> status paid (saldo total cubierto)"
    consumer_futuro: "Worker inventario -> descending product_recipes (SOLO al 100% pagado)"
  - name: OrderPartiallyPaid
    emitter: "POST /orders/{id}/pay -> status partially_paid"
    consumer_futuro: "(no acciona inventario hasta paid)"
  - name: TableOpened
    emitter: "POST /orders"
    consumer_futuro: "Reporting analytics"

# -----------------------------------------------------------------------------
# Regla de negocio: calculo de subtotal y pagos
# -----------------------------------------------------------------------------
business_rules:
  money:
    currency: "COP (peso colombiano)"
    storage: "entero en pesos, SIN centavos (ej. 5000, no 5000.00)"
    rounding: "ROUND_HALF_UP a pesos enteros en cualquier division/ajuste de saldo"
  subtotal: "sum(order_items.total_price)"
  total_amount: "= subtotal"
  amount_paid: "sum(payments.amount) para una orden"
  paid_quantity: "sum(payment_allocations.quantity) por order_item"
  pending_by_items: "sum((order_items.quantity - order_items.paid_quantity) * order_items.unit_price)"
  remaining: "total_amount - amount_paid  (debe == pending_by_items)"
  paid_condition: "remaining == 0"
  paid_at_set: "CUANDO status cambia a paid (remaining == 0)"
  table_free_condition: "remaining == 0"
  edit_item_quantity: "quantity puede bajar pero NUNCA por debajo de paid_quantity (quantity >= paid_quantity). Si se intenta -> 409. Para bajar mas, primero cancelar el/los pagos de esa linea."
  cancel_payment_result: "Revierte el pago y sus allocations (items vuelven a pendiente). Recalcula: si amount_paid == 0 -> status closed; si amount_paid > 0 -> partially_paid. Si la orden estaba paid y deja de estarlo -> paid_at = null. Mesa occupied salvo remaining == 0."
  cost_visibility: "product.cost visible SOLO para admin. El mesero ve product.price (valor de venta), nunca cost (valor de compra/margen)."
  payment_modes:
    partial: "con allocations [{item_id, quantity}] -> descuenta items puntuales (pokers)"
    total: "sin allocations -> cubre todo el remaining y auto-asigna items pendientes"
  timezone: "America/Bogota"

# -----------------------------------------------------------------------------
# Roadmap de Escalabilidad
# -----------------------------------------------------------------------------
roadmap:
  mvp: "POS completo + login + pagos parciales por item + pago total + corte dia"
  f1: "Stock: inventory_items, inventory_movements, product_recipes"
  f2: "Cocina/Preparacion: colas, WS /ws/kitchen"
  f3: "Multi-sucursal, propinas, anulaciones con permiso"

# -----------------------------------------------------------------------------
# Plan de Testing
# -----------------------------------------------------------------------------
testing:
  backend_unit:
    tool: pytest
    scope: "services, scopes, pagos parciales por item, snapshots"
  frontend_unit:
    tool: vitest
    scope: "hooks WS, stores Zustand"
  api_integration:
    tool: "pytest + TestClient"
    scope: "endpoints + DB rollback transaccional"
  contract:
    tool: pact
    scope: "schemas frontend <-> backend"
  e2e:
    tool: playwright
    scope: "login -> mesa -> orden -> pago parcial por item -> pago total -> reporte"
  ws_e2e:
    tool: "playwright"
    scope: "conexion WS + broadcast eventos (table_status_update, order_updated, payment_made)"
  load:
    tool: locust
    scope: "picos fin de semana"
  security:
    tool: owasp-zap
    scope: "escaneo endpoints"
  ci:
    tool: "GitHub Actions"
    steps: "lint, test, build, contract"

# -----------------------------------------------------------------------------
# Estructura propuesta del proyecto
# -----------------------------------------------------------------------------
project_structure:
  root: "app-bar/"
  layout: |
    app-bar/
    ├── specs/
    │   ├── PDR.yaml              # este archivo (spec master)
    │   └── openapi.yaml          # spec API REST (OpenAPI 3.1)
    ├── docs/
    │   └── CLIENT_SPEC.md        # requisitos para cliente
    ├── AGENTS.md                 # convenciones repo
    ├── backend/
    │   ├── app/
    │   │   ├── api/v1/        # routers
    │   │   ├── core/          # config, security, db, websocket
    │   │   ├── models/
    │   │   ├── schemas/
    │   │   ├── services/
    │   │   ├── events/
    │   │   └── main.py
    │   ├── alembic/
    │   ├── tests/
    │   ├── pyproject.toml
    │   └── Dockerfile
    ├── frontend/
    │   ├── app/
    │   ├── components/
    │   ├── hooks/
    │   ├── stores/
    │   ├── lib/
    │   ├── tests/
    │   └── Dockerfile
    └── infra/
        ├── docker-compose.yml
        ├── Caddyfile
        └── .env.example
